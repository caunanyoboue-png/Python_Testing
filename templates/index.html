<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUDLFT Registration</title>

    <style>
        /* === Style global === */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f9fafb);
            margin: 0;
            padding: 40px 0;
            color: #2c3e50;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* === Conteneur principal === */
        .container {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 420px;
            width: 90%;
            transition: all 0.3s ease;
            margin-bottom: 40px;
        }

        .container:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #1d3557;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        p {
            color: #457b9d;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        label {
            font-weight: 600;
            color: #264653;
            margin-bottom: 8px;
        }

        input[type="email"] {
            padding: 10px 14px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            width: 100%;
            max-width: 260px;
            font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: #457b9d;
            box-shadow: 0 0 0 3px rgba(69, 123, 157, 0.2);
        }

        button {
            margin-top: 20px;
            background: linear-gradient(90deg, #457b9d, #1d3557);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(69, 123, 157, 0.3);
            transition: all 0.3s ease;
        }

        button:hover {
            background: linear-gradient(90deg, #1d3557, #264653);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 16px rgba(29, 53, 87, 0.4);
        }

        /* === Tableau === */
        table {
            border-collapse: collapse;
            width: 80%;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        th, td {
            padding: 12px 16px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background-color: #1d3557;
            color: white;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        tfoot td {
            font-weight: bold;
            background-color: #f3f4f6;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to the GUDLFT Registration Portal!</h1>
        <p>Please enter your secretary email to continue:</p>

        <form action="showSummary" method="post">
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="ex: club@example.com" required />
            <button type="submit">Enter</button>
        </form>
    </div>

    <h1>Récapitulatif des points par club</h1>
    <table id="clubs-table">
        <thead>
            <tr><th>Club</th><th>Email</th><th>Points</th></tr>
        </thead>
        <tbody></tbody>
        <tfoot>
            <tr><td>Total</td><td></td><td id="total"></td></tr>
        </tfoot>
    </table>

    <script>
    async function loadClubs() {
        try {
            const response = await fetch('/clubs_data');
            const data = await response.json();

            const tbody = document.querySelector('#clubs-table tbody');
            tbody.innerHTML = ''; // vider avant de recharger

            let total = 0;
            data.clubs.forEach(c => {
                const pts = Number(c.points) || 0;
                total += pts;
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${c.name}</td><td>${c.email}</td><td>${pts}</td>`;
                tbody.appendChild(tr);
            });

            document.getElementById('total').textContent = total;
        } catch (err) {
            console.error('Erreur de chargement des clubs :', err);
        }
    }

    // Chargement initial
    loadClubs();

    // Rafraîchissement automatique toutes les 10 secondes
    setInterval(loadClubs, 10000);
</script>

</body>
</html>
